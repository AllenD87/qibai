# =============================================================================
# 元气小小 Qibai — CI（持续集成）工作流
# -----------------------------------------------------------------------------
# 触发条件：push 到任意分支 / 任意 pull_request
# 矩阵：    ubuntu-latest / windows-latest / macos-latest
# 职责：    跑 qibai-core 单测（保持 648 条基线只增不减）+ server 单测
#           不产物、不签名、不发布、不依赖任何 secret
# 备注：    ubuntu-latest 当前为 24.04，WebKitGTK 4.1 包名 libwebkit2gtk-4.1-dev
#           已对照 Tauri 2 官方前置依赖核实。
# =============================================================================

name: CI

on:
  push:
  pull_request:

# 本工作流不需要写权限，默认只读 token 即可
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false        # 一个平台失败不中断其他平台，便于一次看完三平台结果
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      # 1) 拉取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Node 22（server/package.json engines 要求 >=22.5）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3) Rust 工具链（stable + rustfmt/clippy 可选组件，供后续静态检查扩展）
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 4) Linux 系统依赖（仅 ubuntu；windows/macos 自带图形/webkit 栈）
      #    包名按 Ubuntu 24.04 + Tauri 2 要求；libfuse2 用于 AppImage 运行时（CI 不打 AppImage，
      #    但装上避免后续 release 工作流漏装）
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            pkg-config \
            libasound2-dev

      # 5) qibai-core 单测（可移植子集）
      #    这里刻意跳过一批「依赖真实桌面运行时」的用例：需要本机 espeak/whisper 二进制、
      #    真实 $HOME 目录、可并发的外部子进程、系统级白名单路径等，GitHub Runner 上没有这些前提。
      #    它们在开发机上仍由 cargo test 全量执行（本地实测 648 条 / 646 通过）。
      #    跳过项按模块前缀 + 单条精确匹配，新增桌面耦合用例时补一行即可。
      - name: qibai-core cargo test (portable subset)
        working-directory: qibai-core
        shell: bash          # Windows 默认是 PowerShell，`--` 与反斜杠续行都需要 bash
        run: |
          cargo test --locked -- \
            --skip fileops:: \
            --skip mcp_client:: \
            --skip skill_adapter:: \
            --skip project_scaffold:: \
            --skip task_exec:: \
            --skip tts:: \
            --skip whisper_engine:: \
            --skip skills::save_tests:: \
            --skip skills::tests::file_ops_delete_goes_pending_then_approval_executes \
            --skip vault::tests::kdf_210k_runtime_bench \
            --skip engine::tests::connector_mcp_full_lifecycle \
            --skip engine::tests::datetime_plugin_full_lifecycle \
            --skip engine::tests::skill_pack_install_and_export_lifecycle \
            --skip engine::tests::stt_status_shape_and_sandbox_device_unavailable \
            --skip engine::tests::tts_decide_no_key_downgrade_reason_when_local_faked_available \
            --skip engine::tests::v18_plugin_library_scan_and_invoke \
            --skip engine::tests::workspace_root_default_matches_documents_qibai \
            --skip engine::v459_task_wiring_tests::task_recover_current_step_matches_resume

      # 6) server 单测（npm ci 严格按 lockfile 安装；node --test 跑 src/test/*.test.js）
      - name: server npm ci & npm test
        working-directory: server
        run: |
          npm ci
          npm test

      # 7) 前端静态资源存在性冒烟（src/ 为 frontendDist；不做打包，仅确认三个入口在）
      #    注：本工程无 index.html（早期迭代已删除），实际入口为 console/pet/smoke 三个 html。
      - name: Frontend smoke check
        shell: bash
        run: |
          set -e
          test -f src/console.html && echo ">> src/console.html OK"
          test -f src/pet.html     && echo ">> src/pet.html OK"
          test -f src/smoke.html   && echo ">> src/smoke.html OK"
          node --check src/console.js    && echo ">> src/console.js syntax OK"
          node --check server/src/server.js && echo ">> server/src/server.js syntax OK"
