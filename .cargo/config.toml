# v45.31-d：撤销 v45.30 的测试串行化，恢复并行。
#
# v45.30 曾设 RUST_TEST_THREADS=1，因为多个 #[test] 并行时偶发 `PermissionDenied`
# 与「找不到能力包」。当时判断是 `QIBAI_DATA_DIR` / `QIBAI_PLUGINS_DIR` 这类
# 进程级环境变量互相踩，实际排查下来真因不在 env，而在 skill 根注入：
#
#   `skill_docs::set_plugin_roots` 用的是 OnceLock 语义——**只有第一次生效**，
#   后续调用被静默忽略；而若干测试的临时根目录又按 `process::id()` 固定命名，
#   于是多个测试共用「最先设置的那一对目录」，收尾时又各自 `remove_dir_all`，
#   并行时就会把别人正在用的包删掉（表现为 PermissionDenied / 找不到能力包）。
#
# v45.31-d 的修法：
#   1. `skill_docs::roots()` 改为「线程内覆盖 → 进程级 RwLock 默认值」；
#   2. 新增 `skill_docs::with_plugin_roots(builtin, user, f)`，作用域结束（含 panic）自动恢复；
#   3. `set_plugin_roots` 改为可重设（生产仍由 main.rs 启动时调用一次）；
#   4. `skill_install::with_temp_user_plugins` 与 `skill_docs` 相关测试改用
#      `test_support::unique_temp_dir` 的唯一目录，不再按 pid 共享。
#
# 验证：`RUST_TEST_THREADS=8 cargo test --locked -p qibai-core` 连续 3 轮
# 706 passed / 0 failed（串行基线为 705 项 + 1 项旧 ignore 已解除）。
# 因此不再需要全局串行；如需临时回到串行，用 `RUST_TEST_THREADS=1 cargo test ...`
# 覆盖即可（shell 环境变量优先于本文件）。
